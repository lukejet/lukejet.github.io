<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你好，我是小智 · AI 助手</title>
<style>
  :root{
    --cyan:#4facfe;
    --blue:#00f2fe;
    --purple:#a855f7;
    --pink:#f472b6;
    --text:#e8ecf8;
    --muted:#9aa4c4;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 15% 0%, #1b1140 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 100%, #06283d 0%, transparent 55%),
      linear-gradient(160deg,#070713 0%, #0d0a1f 55%, #060610 100%);
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- 背景光斑 ---------- */
  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    opacity:.5;
    pointer-events:none;
    animation:float 14s ease-in-out infinite;
  }
  .orb1{ width:380px; height:380px; background:var(--purple); top:-120px; left:-100px; }
  .orb2{ width:320px; height:320px; background:var(--cyan); bottom:-120px; right:-80px; animation-delay:-5s; }
  .orb3{ width:240px; height:240px; background:var(--pink); top:45%; left:70%; opacity:.28; animation-delay:-9s; }

  @keyframes float{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%    { transform:translate(30px,-40px) scale(1.12); }
  }

  /* ---------- 主卡片 ---------- */
  .card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:780px;
    padding:56px 48px 44px;
    text-align:center;
    border-radius:28px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.10);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:
      0 30px 80px -20px rgba(0,0,0,.75),
      inset 0 1px 0 rgba(255,255,255,.08);
    animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(28px) scale(.97); }
    to  { opacity:1; transform:none; }
  }

  /* ---------- 头像 ---------- */
  .avatar{
    position:relative;
    width:132px; height:132px;
    margin:0 auto 28px;
  }
  .ring{
    position:absolute; inset:0;
    border-radius:50%;
    border:2px solid transparent;
    background:conic-gradient(from 0deg, var(--cyan), var(--purple), var(--pink), var(--cyan)) border-box;
    -webkit-mask:linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask-composite:exclude;
    animation:spin 6s linear infinite;
  }
  .ring::after{
    content:"";
    position:absolute; inset:-8px;
    border-radius:50%;
    border:1px dashed rgba(255,255,255,.18);
    animation:spin 18s linear infinite reverse;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .core{
    position:absolute; inset:12px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:30px; font-weight:800; letter-spacing:1px;
    background:linear-gradient(140deg,#1a2340,#2b1d52);
    color:#fff;
    box-shadow:
      0 0 40px rgba(79,172,254,.55),
      inset 0 0 30px rgba(168,85,247,.45);
    animation:breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ box-shadow:0 0 32px rgba(79,172,254,.45), inset 0 0 26px rgba(168,85,247,.35); }
    50%    { box-shadow:0 0 60px rgba(79,172,254,.8),  inset 0 0 40px rgba(168,85,247,.6); }
  }

  /* ---------- 文字 ---------- */
  h1{
    font-size:clamp(26px, 4.6vw, 40px);
    font-weight:800;
    letter-spacing:.5px;
    margin-bottom:14px;
  }
  .grad{
    background:linear-gradient(92deg,var(--cyan),var(--purple),var(--pink));
    background-size:220% 100%;
    -webkit-background-clip:text;
            background-clip:text;
    color:transparent;
    animation:flow 5s linear infinite;
  }
  @keyframes flow{ to{ background-position:220% 0; } }

  .typed-line{
    min-height:30px;
    font-size:clamp(14px,2.2vw,17px);
    color:var(--muted);
    letter-spacing:.4px;
    margin-bottom:22px;
  }
  .caret{
    display:inline-block;
    width:2px; height:1em;
    margin-left:2px;
    vertical-align:-2px;
    background:var(--cyan);
    animation:blink .9s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .desc{
    font-size:15px;
    line-height:1.95;
    color:#b9c2de;
    max-width:600px;
    margin:0 auto 34px;
  }
  .desc b{ color:#fff; font-weight:600; }

  /* ---------- 技能卡片 ---------- */
  .skills{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
    gap:14px;
    margin-bottom:32px;
  }
  .skill{
    padding:20px 16px;
    border-radius:16px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    transition:.35s cubic-bezier(.2,.8,.2,1);
    text-align:center;
  }
  .skill:hover{
    transform:translateY(-6px);
    background:rgba(255,255,255,.08);
    border-color:rgba(79,172,254,.5);
    box-shadow:0 16px 32px -14px rgba(79,172,254,.6);
  }
  .skill .ico{ font-size:24px; display:block; margin-bottom:8px; }
  .skill .name{ font-size:14px; font-weight:600; margin-bottom:4px; }
  .skill .sub{ font-size:12px; color:var(--muted); }

  /* ---------- 标签 ---------- */
  .tags{
    display:flex; flex-wrap:wrap; gap:10px;
    justify-content:center;
    padding-top:24px;
    border-top:1px solid rgba(255,255,255,.08);
  }
  .tag{
    font-size:12.5px;
    padding:6px 14px;
    border-radius:999px;
    color:#cbd5f5;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    transition:.3s;
  }
  .tag:hover{
    color:#fff;
    border-color:var(--cyan);
    background:rgba(79,172,254,.16);
  }

  /* ---------- 响应式 ---------- */
  @media (max-width:560px){
    .card{ padding:40px 22px 32px; border-radius:22px; }
    .avatar{ width:104px; height:104px; }
    .core{ font-size:24px; }
    .skills{ grid-template-columns:repeat(2,1fr); gap:10px; }
    .skill{ padding:16px 10px; }
  }
</style>
</head>
<body>

  <!-- 背景光斑 -->
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <main class="card">

    <!-- 头像 -->
    <div class="avatar">
      <div class="ring"></div>
      <div class="core">AI</div>
    </div>

    <!-- 标题 -->
    <h1>你好，我是 <span class="grad">小智</span></h1>

    <!-- 打字机 -->
    <p class="typed-line">
      <span id="typed"></span><span class="caret"></span>
    </p>

    <!-- 介绍正文 -->
    <p class="desc">
      我是一个由大语言模型驱动的 <b>AI 助手</b>，没有实体，却随时在线。<br>
      我不靠记忆背答案，而是理解你的意图，再一步步推理、组织、输出。<br>
      你可以把我当成一个<b>随叫随到的伙伴</b>——不怕问题幼稚，也不嫌需求琐碎。
    </p>

    <!-- 能力卡片 -->
    <div class="skills">
      <div class="skill">
        <span class="ico">💻</span>
        <div class="name">写代码</div>
        <div class="sub">生成 · 调试 · 重构</div>
      </div>
      <div class="skill">
        <span class="ico">✍️</span>
        <div class="name">写文字</div>
        <div class="sub">文案 · 总结 · 润色</div>
      </div>
      <div class="skill">
        <span class="ico">🧠</span>
        <div class="name">想问题</div>
        <div class="sub">推理 · 分析 · 建议</div>
      </div>
      <div class="skill">
        <span class="ico">🌍</span>
        <div class="name">查知识</div>
        <div class="sub">概念 · 翻译 · 解释</div>
      </div>
    </div>

    <!-- 标签 -->
    <div class="tags">
      <span class="tag">24 小时在线</span>
      <span class="tag">耐心无限</span>
      <span class="tag">中文友好</span>
      <span class="tag">持续学习</span>
      <span class="tag">随时打断我</span>
    </div>

  </main>

<script>
  const el = document.getElementById('typed');
  const lines = [
    '我可以写代码、改 Bug、解释报错 💻',
    '我可以陪你聊天、出主意、解闷 ☕',
    '我可以读文档、做总结、写方案 📄',
    '那么，今天想让我帮你做点什么？'
  ];

  let li = 0, ci = 0, deleting = false;

  function tick(){
    const cur = lines[li];

    if(!deleting){
      el.textContent = cur.slice(0, ++ci);
      if(ci === cur.length){
        deleting = true;
        return setTimeout(tick, 1600);
      }
      return setTimeout(tick, 65);
    } else {
      el.textContent = cur.slice(0, --ci);
      if(ci === 0){
        deleting = false;
        li = (li + 1) % lines.length;
        return setTimeout(tick, 350);
      }
      return setTimeout(tick, 30);
    }
  }

  setTimeout(tick, 600);
</script>
</body>
</html>
